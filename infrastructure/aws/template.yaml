AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  MidnightHelixCTW Phase 1 TestWired API with a bounded read-only CockroachDB
  connection and environment-marker probe. No memory, vector, model, wallet,
  or test-network operation is enabled.

Rules:
  DeployOnlyInUsEast1:
    Assertions:
      - Assert: !Equals [!Ref AWS::Region, us-east-1]
        AssertDescription: MidnightHelixCTW TestWired is pinned to us-east-1.

Parameters:
  CockroachRuntimeSecretArn:
    Type: String
    NoEcho: true
    AllowedPattern: '^arn:aws:secretsmanager:us-east-1:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]{1,512}-[A-Za-z0-9]{6}$'
    ConstraintDescription: >-
      Supply the full us-east-1 ARN of the existing Cockroach runtime secret.
      Wildcards, secret values, partial ARNs, and secret creation are not accepted.

  PublicAllowedOrigins:
    Type: String
    AllowedPattern: '^https://[A-Za-z0-9.-]+(?::[0-9]+)?(?:,https://[A-Za-z0-9.-]+(?::[0-9]+)?){0,3}$'
    ConstraintDescription: >-
      Supply one to four exact comma-delimited HTTPS origins without paths,
      spaces, credentials, query strings, fragments, or wildcards.

  ReleaseCommit:
    Type: String
    AllowedPattern: '^[0-9a-f]{40}$'
    ConstraintDescription: Supply the exact 40-character Git commit deployed.

  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [7, 14, 30, 60, 90]

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [x86_64]
    MemorySize: 256
    Timeout: 10
    Environment:
      Variables:
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: "1"
        MHELIX_MAX_REQUEST_BYTES: "4096"
        MHELIX_MAX_RESPONSE_BYTES: "32768"

Resources:
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/apigateway/${AWS::StackName}
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: MidnightHelixCTW
        - Key: Stage
          Value: TestWired

  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-worker
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: MidnightHelixCTW
        - Key: Stage
          Value: TestWired

  ApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Least-privilege role for logs and one named Cockroach runtime secret.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteOnlyOwnSanitizedLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteFunctionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub >-
                  arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-worker:*
        - PolicyName: ReadNamedCockroachRuntimeSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadNamedCockroachRuntimeSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref CockroachRuntimeSecretArn
      Tags:
        - Key: Project
          Value: MidnightHelixCTW
        - Key: Stage
          Value: TestWired

  TestWiredHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: MidnightHelixCTW fixed-operation TestWired front door.
      StageName: $default
      DisableExecuteApiEndpoint: false
      FailOnWarnings: true
      DefinitionBody:
        openapi: 3.0.1
        info:
          title:
            Fn::Sub: ${AWS::StackName} TestWired API
          version: "1.0.0"
        servers:
          - url: "/"
        x-amazon-apigateway-cors:
          allowOrigins: !Split [",", !Ref PublicAllowedOrigins]
          allowHeaders:
            - Content-Type
            - Idempotency-Key
          allowMethods:
            - GET
            - POST
            - OPTIONS
          exposeHeaders:
            - X-Request-Id
          maxAge: 300
          allowCredentials: false
        paths: {}
      DefaultRouteSettings:
        ThrottlingBurstLimit: 2
        ThrottlingRateLimit: 1
        DetailedMetricsEnabled: true
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength","integrationStatus":"$context.integrationStatus","responseLatency":"$context.responseLatency","integrationLatency":"$context.integrationLatency"}
      Tags:
        Project: MidnightHelixCTW
        Stage: TestWired

  ApiFunction:
    Type: AWS::Serverless::Function
    DependsOn: ApiFunctionLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-worker
      Description: >-
        Validates the fixed synthetic workflow, performs one bounded read-only
        Cockroach connection and environment probe, and keeps mutations disabled.
      CodeUri: ../../
      Handler: src/lambda.handler
      Role: !GetAtt ApiFunctionRole.Arn
      Environment:
        Variables:
          MHELIX_PUBLIC_ALLOWED_ORIGINS: !Ref PublicAllowedOrigins
          MHELIX_RELEASE_COMMIT: !Ref ReleaseCommit
          MHELIX_COCKROACH_RUNTIME_SECRET_ARN: !Ref CockroachRuntimeSecretArn
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref TestWiredHttpApi
            Method: GET
            Path: /healthz
            PayloadFormatVersion: "2.0"
        Status:
          Type: HttpApi
          Properties:
            ApiId: !Ref TestWiredHttpApi
            Method: GET
            Path: /api/v1/status
            PayloadFormatVersion: "2.0"
        Scenarios:
          Type: HttpApi
          Properties:
            ApiId: !Ref TestWiredHttpApi
            Method: GET
            Path: /api/v1/judge/scenarios
            PayloadFormatVersion: "2.0"
        StartRun:
          Type: HttpApi
          Properties:
            ApiId: !Ref TestWiredHttpApi
            Method: POST
            Path: /api/v1/judge/runs
            PayloadFormatVersion: "2.0"
        CloseSession:
          Type: HttpApi
          Properties:
            ApiId: !Ref TestWiredHttpApi
            Method: POST
            Path: /api/v1/judge/runs/{runId}/sessions/close
            PayloadFormatVersion: "2.0"
        Recall:
          Type: HttpApi
          Properties:
            ApiId: !Ref TestWiredHttpApi
            Method: POST
            Path: /api/v1/judge/runs/{runId}/recall
            PayloadFormatVersion: "2.0"
        ExecuteAction:
          Type: HttpApi
          Properties:
            ApiId: !Ref TestWiredHttpApi
            Method: POST
            Path: /api/v1/judge/runs/{runId}/actions
            PayloadFormatVersion: "2.0"
        ReadReceipt:
          Type: HttpApi
          Properties:
            ApiId: !Ref TestWiredHttpApi
            Method: GET
            Path: /api/v1/judge/receipts/{receiptId}
            PayloadFormatVersion: "2.0"
      Tags:
        Project: MidnightHelixCTW
        Stage: TestWired
    Metadata:
      BuildMethod: makefile

Outputs:
  TestWiredApiUrl:
    Description: Generated API Gateway HTTPS URL. Use this before custom DNS.
    Value: !Sub https://${TestWiredHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}

  TestWiredFunctionName:
    Description: Phase 1 Lambda function name.
    Value: !Ref ApiFunction

  TestWiredFunctionLogGroupName:
    Description: CloudWatch log group for sanitized Lambda logs.
    Value: !Ref ApiFunctionLogGroup

  TestWiredApiAccessLogGroupName:
    Description: CloudWatch log group for bounded API access metadata.
    Value: !Ref ApiAccessLogGroup

  DeployedReleaseCommit:
    Description: Exact source commit supplied at deployment.
    Value: !Ref ReleaseCommit

  ConfiguredPublicOrigins:
    Description: Exact browser origin allowlist configured for CORS.
    Value: !Ref PublicAllowedOrigins
